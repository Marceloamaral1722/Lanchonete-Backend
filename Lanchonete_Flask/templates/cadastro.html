<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Maxismus Lanches</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <span class="logo-icon">🍔</span>
        <h1 class="logo-title">Maxismus Lanches</h1>
        <p class="logo-subtitle">Criar Conta</p>
      </div>

      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
          {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }}">{{ mensagem }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.cadastro_post') }}">
        <div class="mb-3">
          <label class="form-label">Nome completo</label>
          <input type="text" name="nome" class="form-control" placeholder="Seu nome" required />
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" placeholder="seu@email.com" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Telefone</label>
          <input type="tel" name="telefone" class="form-control" placeholder="(83) 99999-9999" />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="senha" class="form-control" placeholder="Minimo 6 caracteres" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Criar Conta</button>
      </form>

      <div class="text-center">
        <a href="{{ url_for('auth.login') }}" class="small text-muted">Ja tenho conta</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
