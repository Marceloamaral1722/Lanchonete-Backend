{% extends 'base.html' %}
{% block titulo %}
  {% if cliente %}Editar Cliente{% else %}Novo Cliente{% endif %} - Maxismus Lanches
{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">
          {% if cliente %}
            <i class="bi bi-pencil"></i> Editar Cliente
          {% else %}
            <i class="bi bi-person-plus"></i> Novo Cliente
          {% endif %}
        </h5>
      </div>
      <div class="card-body">
        {% if cliente %}
          <form method="POST" action="{{ url_for('clientes.editar_cliente_post', id=cliente.id) }}">
        {% else %}
          <form method="POST" action="{{ url_for('clientes.novo_cliente_post') }}">
        {% endif %}

          <div class="mb-3">
            <label class="form-label">Nome completo *</label>
            <input type="text" name="nome" class="form-control"
                   value="{{ cliente.nome if cliente else '' }}"
                   placeholder="Nome do cliente" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" name="telefone" class="form-control"
                   value="{{ cliente.telefone if cliente else '' }}"
                   placeholder="(83) 99999-9999" />
          </div>
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control"
                   value="{{ cliente.email if cliente else '' }}"
                   placeholder="cliente@email.com" />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ url_for('clientes.listar_clientes') }}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
