<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir Senha - Maxismus Lanches</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <span class="logo-icon">🍔</span>
        <h1 class="logo-title">Maxismus Lanches</h1>
        <p class="logo-subtitle">Redefinir Senha</p>
      </div>

      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
          {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }} mb-3">{{ mensagem }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.redefinir_senha_post', token=token) }}">
        <div class="mb-3">
          <label class="form-label">Nova Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="nova_senha" id="nova-senha" class="form-control"
                   placeholder="Mínimo 4 caracteres" minlength="4" required />
            <button class="btn btn-outline-secondary" type="button"
                    onclick="toggleSenha('nova-senha', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">Salvar Nova Senha</button>
        <div class="text-center">
          <a href="{{ url_for('auth.login') }}" class="link-secondary small">Voltar ao login</a>
        </div>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleSenha(id, btn) {
      var input = document.getElementById(id);
      var icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
