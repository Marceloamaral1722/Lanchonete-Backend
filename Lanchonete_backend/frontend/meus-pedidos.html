<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxismus Lanches - Meus Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="app-body">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid px-4">
      <a href="cardapio.html" class="navbar-brand">🍔 Maxismus Lanches</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small" id="nome-usuario"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h4 class="mb-4"><i class="bi bi-clock-history"></i> Meus Pedidos</h4>

    <div id="lista-pedidos">
      <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2 text-muted">Carregando pedidos...</p>
      </div>
    </div>
  </div>

  <!-- Modal detalhes do pedido -->
  <div class="modal fade" id="modalDetalhes" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalhes do Pedido</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modal-detalhes-body">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
