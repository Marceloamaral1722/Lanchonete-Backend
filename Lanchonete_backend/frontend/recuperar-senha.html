<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxismus Lanches - Recuperar Senha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <span class="logo-icon">🔑</span>
        <h1 class="logo-title">Recuperar Senha</h1>
        <p class="logo-subtitle">Enviaremos um link para seu e-mail</p>
      </div>

      <div id="alerta" class="alert d-none mb-3" role="alert"></div>

      <!-- Etapa 1: Informar e-mail -->
      <div id="etapa-email">
        <form onsubmit="enviarRecuperacao(event)">
          <div class="mb-3">
            <label class="form-label">E-mail cadastrado</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" id="rec-email" class="form-control" placeholder="seu@email.com" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="btn-enviar">
            <span class="spinner-border spinner-border-sm d-none me-2" id="spinner-rec"></span>
            Enviar link de recuperação
          </button>
        </form>
      </div>

      <!-- Etapa 2: Confirmação enviada -->
      <div id="etapa-confirmacao" class="d-none text-center py-3">
        <div class="mb-3">
          <i class="bi bi-envelope-check" style="font-size: 4rem; color: var(--cor-primary);"></i>
        </div>
        <h5>E-mail enviado!</h5>
        <p class="text-muted">Verifique sua caixa de entrada e siga as instruções para redefinir sua senha.</p>
        <p class="text-muted small">Não recebeu? Verifique a pasta de spam.</p>
      </div>

      <div class="text-center mt-3">
        <a href="login.html" class="link-secondary small">
          <i class="bi bi-arrow-left"></i> Voltar para o login
        </a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script>
    async function enviarRecuperacao(e) {
      e.preventDefault();
      const email = document.getElementById('rec-email').value;
      const btn = document.getElementById('btn-enviar');
      const spinner = document.getElementById('spinner-rec');
      const alerta = document.getElementById('alerta');

      btn.disabled = true;
      spinner.classList.remove('d-none');
      alerta.classList.add('d-none');

      try {
        const resp = await fetch(`${API_URL}/auth/recuperar-senha`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await resp.json();

        if (resp.ok) {
          document.getElementById('etapa-email').classList.add('d-none');
          document.getElementById('etapa-confirmacao').classList.remove('d-none');
        } else {
          alerta.className = 'alert alert-danger';
          alerta.textContent = data.message || 'E-mail não encontrado.';
        }
      } catch {
        alerta.className = 'alert alert-danger';
        alerta.textContent = 'Erro de conexão. Verifique se o servidor está rodando.';
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
