<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxismus Lanches - Cardápio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="app-body">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid px-4">
      <span class="navbar-brand">🍔 Maxismus Lanches</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small" id="nome-usuario"></span>
        <a href="meus-pedidos.html" class="btn btn-outline-light btn-sm">
          <i class="bi bi-clock-history"></i> Meus Pedidos
        </a>
        <button class="btn btn-outline-light btn-sm position-relative" onclick="abrirCarrinho()">
          <i class="bi bi-cart3"></i>
          <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill" id="badge-carrinho" style="display:none;">0</span>
        </button>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">

    <!-- Filtro por categoria -->
    <div class="d-flex gap-2 mb-4 flex-wrap" id="filtros-categoria">
      <button class="btn btn-primary btn-sm categoria-btn active" data-categoria="todos" onclick="filtrarCategoria('todos', this)">
        Todos
      </button>
    </div>

    <!-- Grid de produtos -->
    <div class="row g-3" id="lista-produtos">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2 text-muted">Carregando cardápio...</p>
      </div>
    </div>
  </div>

  <!-- Offcanvas Carrinho -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrinho">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title"><i class="bi bi-cart3"></i> Carrinho</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="lista-carrinho" class="flex-grow-1">
        <p class="text-muted text-center mt-4">Seu carrinho está vazio</p>
      </div>
      <div class="border-top pt-3">
        <div class="d-flex justify-content-between mb-1">
          <span>Subtotal</span>
          <strong id="subtotal-carrinho">R$ 0,00</strong>
        </div>
        <button class="btn btn-primary w-100 btn-lg mt-2" onclick="fazerPedido()" id="btn-fazer-pedido" disabled>
          Fazer Pedido
        </button>
      </div>
    </div>
  </div>

  <!-- Modal confirmação de pedido -->
  <div class="modal fade" id="modalConfirmacao" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-4">
          <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
          <h4 class="mt-3">Pedido realizado!</h4>
          <p class="text-muted">Seu pedido foi enviado com sucesso. Acompanhe em "Meus Pedidos".</p>
          <div class="d-flex gap-2 justify-content-center mt-3">
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Continuar comprando</button>
            <a href="meus-pedidos.html" class="btn btn-primary">Ver meus pedidos</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cardapio.js"></script>
</body>
</html>
