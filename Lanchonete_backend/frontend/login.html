<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxismus Lanches - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <span class="logo-icon">🍔</span>
        <h1 class="logo-title">Maxismus Lanches</h1>
        <p class="logo-subtitle">Sabor em cada pedido</p>
      </div>

      <!-- Abas Login / Cadastro -->
      <ul class="nav nav-tabs nav-fill mb-4" id="authTabs">
        <li class="nav-item">
          <button class="nav-link active" id="tab-login" onclick="showTab('login')">Entrar</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-cadastro" onclick="showTab('cadastro')">Cadastrar</button>
        </li>
      </ul>

      <!-- Alerta de erro/sucesso -->
      <div id="alerta" class="alert d-none mb-3" role="alert"></div>

      <!-- Formulário de Login -->
      <form id="form-login" onsubmit="fazerLogin(event)">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="login-email" class="form-control" placeholder="seu@email.com" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="login-senha" class="form-control" placeholder="Sua senha" required />
            <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha('login-senha')">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="btn-login">
          <span class="spinner-border spinner-border-sm d-none me-2" id="spinner-login"></span>
          Entrar
        </button>
        <div class="text-center">
          <a href="recuperar-senha.html" class="link-secondary small">Esqueceu sua senha?</a>
        </div>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="form-cadastro" class="d-none" onsubmit="fazerCadastro(event)">
        <div class="mb-3">
          <label class="form-label">Nome completo</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="cadastro-nome" class="form-control" placeholder="Seu nome" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="cadastro-email" class="form-control" placeholder="seu@email.com" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="cadastro-senha" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required />
            <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha('cadastro-senha')">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirmar senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="cadastro-confirmar" class="form-control" placeholder="Repita a senha" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg" id="btn-cadastro">
          <span class="spinner-border spinner-border-sm d-none me-2" id="spinner-cadastro"></span>
          Criar conta
        </button>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function showTab(tab) {
      document.getElementById('form-login').classList.add('d-none');
      document.getElementById('form-cadastro').classList.add('d-none');
      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('tab-cadastro').classList.remove('active');
      document.getElementById('alerta').classList.add('d-none');

      document.getElementById(`form-${tab}`).classList.remove('d-none');
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    function toggleSenha(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function mostrarAlerta(msg, tipo = 'danger') {
      const el = document.getElementById('alerta');
      el.className = `alert alert-${tipo}`;
      el.textContent = msg;
    }

    // Redireciona se já estiver logado
    if (localStorage.getItem('token')) {
      const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
      window.location.href = usuario.admin ? 'admin.html' : 'cardapio.html';
    }
  </script>
</body>
</html>
